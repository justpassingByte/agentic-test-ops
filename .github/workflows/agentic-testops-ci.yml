name: Agentic TestOps - Tool Self-Test

# Verifies the Agentic TestOps MCP server and its tools through the real MCP stdio protocol.
# It needs no external system: a tiny Node SUT is started inside the job.
#
# The TrustBase suite (tests/trustbase/) is NOT run here: it needs a local TrustBase stack
# (API with --inspect, PostgreSQL, Redis) and refuses non-local targets by design.
# Its official results are committed under testcases/results/ (run7-final.json).

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  self-test:
    name: MCP tools self-test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install MCP server dependencies and Chromium
        working-directory: mcp
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Syntax check
        run: |
          for f in mcp/*.mjs scripts/*.mjs tests/self/*.mjs tests/trustbase/*.mjs; do node --check "$f"; done

      - name: MCP handshake (tools/list)
        run: node scripts/mcp-call.mjs --list

      - name: Tool self-tests through MCP (CDP, browser, exporters)
        timeout-minutes: 5
        run: node --test --test-concurrency=1 --test-timeout=120000 --test-force-exit --test-reporter=spec tests/self/tools.test.mjs

      - name: Validate committed TrustBase evidence
        run: |
          node -e "
            const r = require('./testcases/results/run7-final.json');
            const s = r.summary;
            console.log('run7-final:', JSON.stringify(s));
            if (s.total !== 30 || s.pass + s.fail + s.blocked !== 30) process.exit(1);
            for (const f of ['F-01','F-02','F-03','F-04','F-05']) {
              const hit = require('fs').readdirSync('knowledge').some(n => n.startsWith(f + '-') && n.endsWith('.md'));
              if (!hit) { console.error('missing dossier ' + f); process.exit(1); }
            }"

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: self-test-screenshots-node${{ matrix.node }}
          path: screenshots/debug_*.png
          retention-days: 7
